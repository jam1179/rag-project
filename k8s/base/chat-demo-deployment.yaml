apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-rag-chat-demo
  namespace: mcp-rag
  labels:
    app: mcp-rag-chat-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-rag-chat-demo
  template:
    metadata:
      labels:
        app: mcp-rag-chat-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mcp-rag-chat-demo
          image: mcp-rag-chat-demo:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8501

          envFrom:
            - configMapRef:
                name: mcp-rag-config
            - secretRef:
                name: mcp-rag-chat-demo-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: temporary-storage
              mountPath: /tmp

            - name: streamlit-storage
              mountPath: /home/app/.streamlit

      volumes:
        - name: temporary-storage
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

        - name: streamlit-storage
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi