apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-rag-server
  namespace: mcp-rag
  labels:
    app: mcp-rag-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcp-rag-server
  template:
    metadata:
      labels:
        app: mcp-rag-server
    spec:
      containers:
        - name: mcp-rag-server
          image: mcp-rag-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mcp-rag-config
            - secretRef:
                name: mcp-rag-server-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "6000m"
              memory: "4Gi"
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: lancedb-storage
              mountPath: /data/lancedb
      volumes:
        - name: lancedb-storage
          persistentVolumeClaim:
            claimName: mcp-rag-lancedb