apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - service-accounts.yaml
  - secret-provider-classes.yaml

patches:
  - path: pvc-patch.yaml
  - path: workload-identity-patch.yaml
  - path: keyvault-csi-patch.yaml

images:
  - name: mcp-rag-server
    newName: myregistry.azurecr.io/mcp-rag-server
    newTag: "0.1.0"

  - name: mcp-rag-chat-demo
    newName: myregistry.azurecr.io/mcp-rag-chat-demo
    newTag: "0.1.0"